[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "UP042",  # StrEnum cambiaría str()/format() al valor; el código usa .value explícito, así que se mantiene (str, Enum)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Header", "fastapi.Body"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
